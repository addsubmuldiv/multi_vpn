[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-vpn"
version = "0.1.4"
description = "Independent multi-session SSL VPN desktop tool"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "keyring>=25,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller==6.22.3", "pillow==12.3.0"]

[project.gui-scripts]
multi-vpn = "multi_vpn.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
