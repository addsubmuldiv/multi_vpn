name: Build installers
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -e . pytest pyinstaller==6.22.3 pillow==12.3.0
      - name: Unit tests
        run: python -m pytest -q
      - name: Determine package version
        shell: bash
        run: python scripts/package_version.py >> "$GITHUB_ENV"
      - name: Prepare icon formats
        run: python scripts/make_icons.py
      - name: Windows build and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/install_wintun.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_windows_adapter.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_app.py --version $env:APP_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $process=Start-Process dist/MultiVPN/MultiVPN.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen smoke test failed' }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging/windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" /DInstallerSmokeTest "/DAppVersion=$env:APP_VERSION" packaging/windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify Windows installation and desktop shortcut
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/verify_windows_installer.ps1
          ./scripts/verify_windows_installer.ps1 -PostinstallSmoke
      - name: Apple Silicon app and installers
        if: runner.os == 'macOS'
        run: bash packaging/build_macos.sh "$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MultiVPN-${{ matrix.target }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --title "Multi VPN $RELEASE_TAG" --generate-notes
