name: Intel Mac for 0.1.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest pyinstaller==6.22.3 pillow==12.3.0
      - run: python -m pytest -q
      - name: Select Intel architecture in 0.1.5 build scripts only
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['scripts/build_app.py', 'packaging/build_macos.sh']:
              path=Path(filename)
              original=path.read_text()
              assert 'arm64' in original
              path.write_text(original.replace('arm64','x86_64'))
          PY
      - run: python scripts/make_icons.py
      - run: bash packaging/build_macos.sh 0.1.5
      - uses: actions/upload-artifact@v4
        with:
          name: MultiVPN-0.1.5-macos-x86_64
          path: dist/installers/*
          if-no-files-found: error
      - name: Add Intel installers to existing 0.1.5 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist/installers
          shasum -a 256 *.pkg *.dmg > SHA256SUMS-macos-x86_64.txt
          gh release upload v0.1.5 ./*.pkg ./*.dmg SHA256SUMS-macos-x86_64.txt
